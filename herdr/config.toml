onboarding = false
[ui]
agent_panel_sort = "spaces"

# ── 키바인딩 ──────────────────────────────────────────────
# 배열의 첫 항목은 herdr 기본값(prefix 바인딩) 유지용, 두 번째가 prefix 없는 direct 단축키.
# ctrl+alt 조합은 iTerm2/neovim/macOS 기본 단축키와 충돌하지 않는 안전한 modifier 계열
# (공식 문서 권장: https://herdr.dev/docs/keyboard/#going-prefix-free)
show_agent_labels_on_pane_borders = false
[keys]
# prefix는 기본값(ctrl+b) 그대로 사용 — 설정하지 않음

# Pane: 이동 / 분할(생성) / 닫기
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
split_vertical = ["prefix+v", "ctrl+alt+v"]          # 오른쪽으로 분할
split_horizontal = ["prefix+minus", "ctrl+alt+shift+v"] # 아래로 분할 (ctrl+alt+minus는 터미널에 따라 전달이 불안정해서 shift+v 사용)
close_pane = ["prefix+x", "ctrl+alt+x"]
# zoom = ["prefix+z", "ctrl+alt+z"]                  # 필요하면 주석 해제

# Tab: 생성 / 이동 / 닫기
# 탭 = 가로축. HHKB 방향키(Fn+[;'/)의 위치 감각을 Fn 없이 그대로: ;=왼쪽, '=오른쪽
new_tab = ["prefix+c", "ctrl+alt+c"]
next_tab = ["prefix+n", "ctrl+alt+'", "ctrl+alt+right"]
previous_tab = ["prefix+p", "ctrl+alt+;", "ctrl+alt+left"]
switch_tab = ["prefix+1..9", "ctrl+alt+1..9"]
close_tab = ["prefix+shift+x", "ctrl+alt+shift+x"]

# Workspace(윈도우): 생성 / 이동 / 닫기
# 생성/닫기는 Tab과 동일한 문자에 shift 추가: c=생성, d=닫기
# 이동은 세로축 — HHKB 방향키 위치 그대로: [=위, /=아래
new_workspace = ["prefix+shift+n", "ctrl+alt+shift+c"]
next_workspace = ["ctrl+alt+/", "ctrl+alt+down"]      # 기본 바인딩 없음 → direct만
previous_workspace = ["ctrl+alt+[", "ctrl+alt+up"]    # 기본 바인딩 없음 → direct만
workspace_picker = ["prefix+w", "ctrl+alt+w"]
close_workspace = ["prefix+shift+d", "ctrl+alt+shift+d"]

[experimental]
switch_ascii_input_source_in_prefix = true

[ui.sound]
enabled = false
