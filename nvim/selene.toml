# selene 설정 — Neovim 설정 Lua의 린트 기준.
#
# 왜 luacheck가 아니라 selene인가:
#   mason의 luacheck는 luarocks로 설치되어 시스템 Lua 인터프리터를 exec하는 셸 래퍼다.
#   그 인터프리터 경로가 래퍼에 하드코딩되므로 Homebrew lua가 올라가면 조용히 깨진다.
#   실제로 두 번 깨졌다 — lua5.4가 사라져 exit 126, 그리고 luacheck 1.1.0을 Lua 5.5로
#   실행하면 "attempt to assign to const variable"로 exit 1 (업스트림 비호환,
#   mason 레지스트리 최신 버전도 1.1.0이라 올려서 해결할 수 없다).
#   selene은 단일 Rust 바이너리라 인터프리터 의존이 없어 이 실패 유형이 아예 없다.
#
# base가 lua51인 이유: Neovim은 LuaJIT(5.1 + 일부 5.2)을 쓴다. nvim/.luarc.json의
# runtime.version = "LuaJIT"과 맞춘다.
#
# 주의: selene은 selene.toml을 못 찾으면 실행을 거부한다. 그래서
# config/nvim-lint.lua가 버퍼 기준으로 selene.toml을 찾아 cwd로 넘기고, 못 찾으면
# 린터를 건너뛴다(clippy가 Cargo.toml을 다루는 방식과 같다).
std = "lua51+neovim"

[lints]
# vim.* API는 테이블을 그대로 넘기는 경우가 많아 mixed_table 경고가 잡음이 된다.
mixed_table = "allow"
